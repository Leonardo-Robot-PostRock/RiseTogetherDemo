spring.application.name=ITJobsBackend
spring.profiles.active=dev
server.port=9090
spring.main.banner-mode=off
logging.pattern.dateformat=hh:mmq
# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
# JWT
jwt.access-token-validity=900000
jwt.refresh-token-validity=604800000
# Verification - horas hasta que un usuario no verificado se elimina (cleanup)
# Valor por defecto: 24h (usado en dev y prod, sobreescribible con variable de entorno)
auth.verification-token-expiration-hours=24
