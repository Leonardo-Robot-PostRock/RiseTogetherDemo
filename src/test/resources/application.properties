spring.application.name=ITJobsBackend
spring.main.banner-mode=off
# H2 in-memory for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
# Disable Flyway for tests
spring.flyway.enabled=false
# JWT test config
jwt.secret=TestSecretKeyForJWTTokenGeneration2024SecureKeyMustBe256BitsLong!!
jwt.access-token-validity=900000
jwt.refresh-token-validity=604800000
jwt.unverified-user-expiration-hours=1
